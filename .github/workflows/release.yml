name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "instagram-package-reservation-${GITHUB_RUN_NUMBER}" \
            --dir release
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/instagram-package-reservation.apk \
            release/instagram-package-reservation-magisk.zip \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "RottenLimb $GITHUB_REF_NAME"
